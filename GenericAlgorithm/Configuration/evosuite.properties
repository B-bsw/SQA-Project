# EvoSuite 1.2.0 configuration for the GenericAlgorithm experiment

# Search algorithm
algorithm=STANDARD_GA
criterion=LINE:BRANCH
stopping_condition=MAXTIME
search_budget=60
random_seed=20260918

# Generated JUnit suite
assertions=true
minimize=true
minimize_second_pass=true
junit_check=TRUE
junit_check_timeout=60
write_junit_timeout=60

# Required for older Defects4J projects such as Chart.
# It avoids EvoSuite's RMI serialization/class-loading failure.
client_on_thread=true

# Result statistics
new_statistics=true
statistics_backend=CSV
output_variables=TARGET_CLASS,criterion,Coverage,LineCoverage,BranchCoverage

# Console output
show_progress=false
